[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyChanga"
version = "1.0.0"
description = "A small Python music API with synchronized, independent live parts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyChanga = "pyChanga.__main__:main"

[tool.setuptools]
packages = ["pyChanga"]

[tool.setuptools.package-data]
pyChanga = ["sounds/TimGM6mb.sf2", "sounds/*.txt", "sounds/*.json"]
